name: Validar projeto

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/validate.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate-backend:
    name: Validar backend
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:oracle:thin:@//localhost:1521/ci
      DB_USERNAME: ci
      DB_PASSWORD: ci

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: Validar backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        working-directory: backend

  validate-frontend:
    name: Validar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Executar lint
        run: npm run lint
        working-directory: frontend

      - name: Executar testes
        run: npm run test
        working-directory: frontend

      - name: Gerar build
        run: npm run build
        working-directory: frontend
