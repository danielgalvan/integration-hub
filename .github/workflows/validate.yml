name: Validar projeto

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/validate.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate-backend:
    name: Validar backend
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:oracle:thin:@//localhost:1521/ci
      DB_USERNAME: ci
      DB_PASSWORD: ci

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw
        working-directory: backend

      - name: Validar backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        working-directory: backend